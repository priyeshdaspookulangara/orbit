<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORB Protein Powder - Direct Selling 10-Matrix Platform</title>
    <style>
        :root {
            --primary: #d97706;
            --primary-dark: #b45309;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
        .container { max-width: 1100px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        header h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 5px; }
        header p { color: var(--text-muted); }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .card h2 { font-size: 1.25rem; color: var(--primary); margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-muted); }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 4px; color: #fff; font-size: 0.95rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-dark); }

        .stat-box { background: #0f172a; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid var(--border); }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--success); }

        pre { background: #020617; padding: 15px; border-radius: 6px; overflow-x: auto; color: #38bdf8; font-size: 0.85rem; max-height: 300px; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; background: #334155; }
        .tag-active { background: #15803d; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ ORB Protein Powder Platform</h1>
            <p>10-Matrix Structure with Company-Wide BFS Auto-Spillover & Direct Selling Engine</p>
        </header>

        <div class="grid">
            <!-- Registration & Checkout Panel -->
            <div class="card">
                <h2>1. Register New Distributor</h2>
                <form id="regForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="regName" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="regEmail" placeholder="john@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="regPass" value="Secret123!" required>
                    </div>
                    <div class="form-group">
                        <label>Sponsor / Referral Member Code</label>
                        <input type="text" id="regRef" placeholder="e.g. ORB00001" value="ORB00001">
                    </div>
                    <button type="submit">Create Member Account</button>
                </form>
            </div>

            <!-- Package Purchase / Activation -->
            <div class="card">
                <h2>2. Package Purchase (₹6,000)</h2>
                <form id="buyForm">
                    <div class="form-group">
                        <label>Member ID / User ID</label>
                        <input type="number" id="buyUserId" placeholder="Enter User ID (e.g. 2)" required>
                    </div>
                    <div class="form-group">
                        <label>Protein Powder Flavor</label>
                        <select id="buyFlavor">
                            <option value="Double Rich Chocolate">Double Rich Chocolate (2kg)</option>
                            <option value="Vanilla Ice Cream">Vanilla Ice Cream (2kg)</option>
                            <option value="Strawberry Milkshake">Strawberry Milkshake (2kg)</option>
                            <option value="Unflavored Raw Whey">Unflavored Raw Whey (2kg)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Shipping Delivery Address</label>
                        <input type="text" id="buyAddress" placeholder="123 Tech Park, Suite 400, NY" value="742 Evergreen Terrace" required>
                    </div>
                    <button type="submit" style="background:#16a34a;">Pay ₹6,000 & Join Matrix</button>
                </form>
            </div>

            <!-- Member Dashboard Query -->
            <div class="card">
                <h2>3. View Member Dashboard</h2>
                <form id="dashForm">
                    <div class="form-group">
                        <label>Member Code / Member ID</label>
                        <input type="text" id="dashMemberId" placeholder="e.g. ORB00001" value="ORB00001">
                    </div>
                    <button type="submit" style="background:#2563eb;">Fetch Wallet & Tree Position</button>
                </form>
            </div>
        </div>

        <!-- System Output & Response Log -->
        <div class="card" style="margin-bottom:30px;">
            <h2>API Output & Real-time Matrix Event Feed</h2>
            <pre id="apiOutput">// Output will appear here after actions above...</pre>
        </div>
    </div>

    <script>
        const output = document.getElementById('apiOutput');

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('regName').value,
                    email: document.getElementById('regEmail').value,
                    password: document.getElementById('regPass').value,
                    ref: document.getElementById('regRef').value
                })
            });
            const data = await res.json();
            output.textContent = JSON.stringify(data, null, 2);
            if (data.success && data.data.user) {
                document.getElementById('buyUserId').value = data.data.user.id;
            }
        });

        document.getElementById('buyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/checkout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_id: parseInt(document.getElementById('buyUserId').value),
                    flavor: document.getElementById('buyFlavor').value,
                    shipping_address: document.getElementById('buyAddress').value
                })
            });
            const data = await res.json();
            output.textContent = JSON.stringify(data, null, 2);
        });

        document.getElementById('dashForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const memberId = document.getElementById('dashMemberId').value;
            const res = await fetch(`/api/user/dashboard?member_id=${encodeURIComponent(memberId)}`);
            const data = await res.json();
            output.textContent = JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
